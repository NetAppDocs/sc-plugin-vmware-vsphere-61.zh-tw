indexpage:
  title: SnapCenter Plug-in for VMware vSphere文檔
  summary: SnapCenter Plug-in for VMware vSphere是基於 Linux 的虛擬設備。作為獨立產品，它為虛擬機器、資料儲存和
    VMDK 提供快速、節省空間、崩潰一致和虛擬機器一致的備份和復原作業。它還與SnapCenter Server 配合使用，支援 VMware 環境中針對SnapCenter應用程式特定插件的基於應用程式的備份和復原作業。
  keywords: SnapCenter Plug-in for VMware vSphere, SCV
  lead: SnapCenter Plug-in for VMware vSphere是基於 Linux 的虛擬設備。作為獨立產品，它為虛擬機器、資料儲存和 VMDK
